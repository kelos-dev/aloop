apiVersion: apps/v1
kind: Deployment
metadata:
  name: aloop
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: aloop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aloop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: aloop
          image: ghcr.io/kelos-dev/aloop
          workingDir: /var/lib/aloop
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              mkdir -p Maildir/new Maildir/cur Maildir/tmp "$CODEX_HOME"
              seed=/var/run/aloop-login/auth.json
              digest=$(sha256sum "$seed" | cut -d ' ' -f 1)
              recovery=/var/run/aloop-recovery
              # GitHub can supply a snapshot of the login the CLI has since renewed on disk.
              if [ -s "$recovery/auth.json" ] && grep -Fxq "$digest" "$recovery/login-digests"; then
                digest=$(cat "$recovery/seed-digest")
                seed="$recovery/auth.json"
              fi
              if [ ! -s "$CODEX_HOME/auth.json" ] || [ "$digest" != "$(cat "$CODEX_HOME/.seed-digest" 2>/dev/null)" ]; then
                cp "$seed" "$CODEX_HOME/auth.json.tmp"
                chmod 600 "$CODEX_HOME/auth.json.tmp"
                mv "$CODEX_HOME/auth.json.tmp" "$CODEX_HOME/auth.json"
                printf '%s\n' "$digest" > "$CODEX_HOME/.seed-digest"
              fi
              export PATH="/etc/aloop:$PATH"
              exec /usr/local/bin/aloop -config /etc/aloop/aloop.json
          env:
            - name: CODEX_HOME
              value: /var/lib/aloop/codex
            - name: ALOOP_WEB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aloop-credentials
                  key: ALOOP_WEB_PASSWORD
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/aloop
              readOnly: true
            - name: data
              mountPath: /var/lib/aloop
            - name: login
              mountPath: /var/run/aloop-login
              readOnly: true
            - name: recovery
              mountPath: /var/run/aloop-recovery
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aloop-config
            items:
              - key: aloop.json
                path: aloop.json
              - key: codex
                path: codex
                mode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: aloop-data
        - name: login
          secret:
            secretName: aloop-credentials
            defaultMode: 0440
            items:
              - key: CODEX_AUTH_JSON
                path: auth.json
        - name: recovery
          secret:
            secretName: aloop-codex-recovery
            optional: true
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: aloop
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aloop
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30086
