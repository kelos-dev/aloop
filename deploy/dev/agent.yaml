apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aloop-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aloop
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: aloop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aloop
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: aloop
          image: ghcr.io/kelos-dev/aloop
          workingDir: /var/lib/aloop
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          command: [/bin/sh, -ec]
          args:
            - |
              mkdir -p Maildir/new Maildir/cur Maildir/tmp
              exec /usr/local/bin/aloop -config /etc/aloop/aloop.json
          envFrom:
            - secretRef:
                name: aloop-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/aloop
              readOnly: true
            - name: data
              mountPath: /var/lib/aloop
      volumes:
        - name: config
          configMap:
            name: aloop-config
        - name: data
          persistentVolumeClaim:
            claimName: aloop-data
---
apiVersion: v1
kind: Service
metadata:
  name: aloop
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aloop
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30086
