name: Deploy to Dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish dev image
        id: image
        run: |
          make image PUSH=true IMAGE_PLATFORMS=linux/amd64,linux/arm64 VERSION="sha-$REVISION"
          digest=$(docker buildx imagetools inspect "ghcr.io/kelos-dev/aloop:sha-$REVISION" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: dev
      url: https://dev-aloop.kelos.dev
    concurrency:
      group: deploy-aloop-dev
      queue: max
    steps:
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$REVISION" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping outdated revision $REVISION (main is $current)"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.revision.outputs.current == 'true'
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Deploy aloop and wait for rollout
        if: steps.revision.outputs.current == 'true'
        working-directory: deploy/dev
        env:
          ALOOP_NAMESPACE: ${{ vars.ALOOP_NAMESPACE || 'aloop' }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          ALOOP_WEB_PASSWORD: ${{ secrets.ALOOP_WEB_PASSWORD }}
          DEV_CLUSTER_KUBECONFIG: ${{ secrets.DEV_CLUSTER_KUBECONFIG }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          kustomize edit set image "ghcr.io/kelos-dev/aloop=ghcr.io/kelos-dev/aloop@$IMAGE_DIGEST"
          bash with-cluster.sh bash deploy.sh "$ALOOP_NAMESPACE"
      - name: Check the dev frontend
        if: steps.revision.outputs.current == 'true'
        run: |
          curl -fsS --retry 6 --retry-all-errors --max-time 10 --retry-max-time 90 \
            https://dev-aloop.kelos.dev/ -o "$RUNNER_TEMP/overview.html"
          grep -Fq 'Agent overview' "$RUNNER_TEMP/overview.html"
