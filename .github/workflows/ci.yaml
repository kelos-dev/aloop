name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [verify, build, test, test-e2e, image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make ${{ matrix.target }}
        env:
          TEST_FLAGS: -race
          VERSION: ci
      - name: Test dev rollout and storage
        if: matrix.target == 'image'
        working-directory: deploy/dev
        run: |
          image=ghcr.io/kelos-dev/aloop:ci
          kind create cluster --wait 2m
          kind load docker-image "$image"
          CODEX_AUTH_JSON=$(node ../../.github/tests/codex-oauth.cjs seed)
          export CODEX_AUTH_JSON
          export ALOOP_WEB_PASSWORD=test
          kustomize edit add patch --kind Deployment --name aloop --patch \
            '[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"HTTPS_PROXY","value":"http://127.0.0.1:1"}},
              {"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"PATH","value":"/tmp/oauth-test:/usr/local/bin:/usr/bin:/bin"}}]'
          kustomize edit set image "ghcr.io/kelos-dev/aloop=$image"
          # An incomplete claim needs its source before an agent can use it.
          kubectl create namespace aloop
          kubectl annotate --local -f data.yaml aloop.kelos.dev/copy-source=missing -o json |
            kubectl -n aloop create -f -
          if bash deploy.sh aloop > "$RUNNER_TEMP/missing-source.log" 2>&1; then exit 1; fi
          grep -F 'The source deployment is missing before the data copy completed' "$RUNNER_TEMP/missing-source.log"
          test -z "$(kubectl -n aloop get deployment aloop --ignore-not-found -o name)"
          kubectl delete namespace aloop --timeout=2m

          bash deploy.sh default
          node_ip=$(kubectl get node kind-control-plane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          url="http://$node_ip:30086"
          curl -fsS --retry 5 --retry-all-errors "$url/" -o "$RUNNER_TEMP/overview.html"
          grep -Fq 'Agent overview' "$RUNNER_TEMP/overview.html"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/inbox")" = 401
          curl -fsS -u aloop:test "$url/inbox" -o "$RUNNER_TEMP/inbox.html"
          grep -Fq 'Filter signals' "$RUNNER_TEMP/inbox.html"
          kubectl exec deployment/aloop -- sh -ec 'test -s inbox.db && touch Maildir/tmp/persistence-test'
          bash ../../.github/tests/dev-namespace.sh
          kubectl config set-context --current --namespace=aloop
          kubectl exec deployment/aloop -- /etc/aloop/codex --version
          bash ../../.github/tests/dev-refresh.sh aloop
          curl -fsS -u aloop:test "$url/inbox" -o /dev/null
