name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [verify, build, test, test-e2e, image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make ${{ matrix.target }}
        env:
          TEST_FLAGS: -race
          VERSION: ci
      - name: Test dev rollout and storage
        if: matrix.target == 'image'
        working-directory: deploy/dev
        run: |
          image=ghcr.io/kelos-dev/aloop:ci
          kind create cluster --wait 2m
          kind load docker-image "$image"
          export CODEX_AUTH_JSON='{"tokens":{"access_token":"fixture"}}'
          ALOOP_WEB_PASSWORD=test bash prepare-credentials.sh default
          kustomize edit add patch --kind Deployment --name aloop --patch \
            '[{"op":"add","path":"/spec/template/spec/containers/0/env/-","value":{"name":"HTTPS_PROXY","value":"http://127.0.0.1:1"}}]'
          kustomize edit set image "ghcr.io/kelos-dev/aloop=$image"
          kubectl apply -k .
          kubectl rollout status deployment/aloop --timeout=3m
          node_ip=$(kubectl get node kind-control-plane -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
          url="http://$node_ip:30086"
          curl -fsS --retry 5 --retry-all-errors "$url/" -o "$RUNNER_TEMP/overview.html"
          grep -Fq 'Agent overview' "$RUNNER_TEMP/overview.html"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$url/inbox")" = 401
          curl -fsS -u aloop:test "$url/inbox" -o "$RUNNER_TEMP/inbox.html"
          grep -Fq 'Filter signals' "$RUNNER_TEMP/inbox.html"
          kubectl exec deployment/aloop -- sh -ec 'test -s inbox.db && touch Maildir/tmp/persistence-test'
          rotated='{"tokens":{"access_token":"refreshed-fixture"}}'
          test "$(kubectl exec deployment/aloop -- cat /var/lib/aloop/codex/auth.json)" = "$CODEX_AUTH_JSON"
          printf '%s' "$rotated" | kubectl exec -i deployment/aloop -- sh -ec 'cat > "$CODEX_HOME/auth.json"'
          kubectl rollout restart deployment/aloop
          kubectl rollout status deployment/aloop --timeout=3m
          kubectl exec deployment/aloop -- test -f Maildir/tmp/persistence-test
          test "$(kubectl exec deployment/aloop -- cat /var/lib/aloop/codex/auth.json)" = "$rotated"
          export CODEX_AUTH_JSON='{"tokens":{"access_token":"replacement-fixture"}}'
          bash prepare-credentials.sh default
          kubectl apply -k .
          kubectl rollout status deployment/aloop --timeout=3m
          test "$(kubectl exec deployment/aloop -- cat /var/lib/aloop/codex/auth.json)" = "$CODEX_AUTH_JSON"
          curl -fsS -u aloop:test "$url/inbox" -o /dev/null
